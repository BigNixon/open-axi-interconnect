site_name: Open AXI Interconnect
site_description: Synthesizable AXI4/AXI4-Lite crossbar interconnect documentation
site_author: Open AXI Interconnect Contributors
site_url: https://open-axi-interconnect.github.io/open-axi-interconnect
copyright: Copyright &copy; 2024 Open AXI Interconnect Contributors — Licensed under MIT

repo_name: open-axi-interconnect
repo_url: https://github.com/open-axi-interconnect/open-axi-interconnect
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  logo: assets/images/logo.svg
  favicon: assets/images/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - content.tooltips
    - content.tabs.link

plugins:
  - search:
      lang: en
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      toc_depth: 4

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/open-axi-interconnect/open-axi-interconnect
  version:
    provider: mike
  analytics:
    provider: google
    property: G-XXXXXXXXXX
  generator: false

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/index.md
      - getting-started/quickstart.md
      - getting-started/installation.md
      - getting-started/simulation.md
  - Architecture:
      - architecture/index.md
      - architecture/overview.md
      - architecture/memory-map.md
      - architecture/register-map.md
      - architecture/fsm-diagrams.md
      - architecture/axi-protocol.md
  - RTL Reference:
      - rtl/index.md
      - rtl/top-level.md
      - rtl/interconnect.md
      - rtl/peripherals.md
  - Verification:
      - verification/index.md
      - verification/test-plan.md
      - verification/cocotb-tests.md
      - verification/assertions.md
      - verification/coverage.md
  - Development:
      - development/index.md
      - development/contributing.md
      - development/ci-cd.md
      - development/changelog.md
  - API Reference:
      - api/index.md
      - api/memory-map-api.md
      - api/register-api.md
